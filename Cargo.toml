[package]
name = "pastel"
version = "1.0.1"
edition = "2021"
description = "Win+V style clipboard history manager for Linux (GNOME, Ubuntu, Wayland)"
license = "MIT"
repository = "https://github.com/raheem-dotgit/pastel"
homepage = "https://github.com/raheem-dotgit/pastel"
readme = "README.md"
keywords = ["clipboard", "clipboard-manager", "gtk4", "wayland", "gnome"]
categories = ["gui"]
publish = false

[dependencies]
gtk4 = "0.11.5"
libadwaita = "0.9.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
opt-level = 2
lto = true
strip = true
